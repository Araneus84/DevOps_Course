apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: myapp-logs-pvc
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass }}
  {{- end }}
